<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="glowBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <rect width="1000" height="550" rx="14" fill="url(#archBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Title -->
  <text x="500" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="800" text-anchor="middle">
    BILLER SYSTEM ARCHITECTURE &amp; ZERO-CLIENT-AUTHORITY TOPOLOGY
  </text>
  <text x="500" y="70" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">
    Local Area Network (LAN) High-Speed Multi-Counter POS &amp; Authoritative Financial Ledger
  </text>

  <!-- Left: Store LAN Terminals -->
  <g transform="translate(60, 105)">
    <rect width="260" height="390" rx="12" fill="#0b1324" stroke="#38bdf8" stroke-dasharray="4,4" stroke-width="1.5" />
    <text x="130" y="32" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      STORE LAN COUNTERS
    </text>
    <text x="130" y="48" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Sub-10ms UI Latency</text>

    <!-- Terminal 1 -->
    <g transform="translate(18, 68)">
      <rect width="224" height="88" rx="8" fill="url(#glowBox)" stroke="#334155" />
      <text x="14" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Counter 1 POS (Tauri v2)</text>
      <text x="14" y="44" fill="#94a3b8" font-family="monospace" font-size="10">X-Terminal-Id: COUNTER-1</text>
      <text x="14" y="62" fill="#10b981" font-family="sans-serif" font-size="10">⚡ Barcode Scanner + Hotkeys</text>
      <text x="14" y="78" fill="#38bdf8" font-family="sans-serif" font-size="10">🖨️ 80mm ESC/POS Printer</text>
    </g>

    <!-- Terminal 2 -->
    <g transform="translate(18, 172)">
      <rect width="224" height="88" rx="8" fill="url(#glowBox)" stroke="#334155" />
      <text x="14" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Counter 2 POS (Tauri v2)</text>
      <text x="14" y="44" fill="#94a3b8" font-family="monospace" font-size="10">X-Terminal-Id: COUNTER-2</text>
      <text x="14" y="62" fill="#10b981" font-family="sans-serif" font-size="10">⚡ High-Volume Retail Checkout</text>
      <text x="14" y="78" fill="#38bdf8" font-family="sans-serif" font-size="10">🖨️ 58mm Thermal Printer</text>
    </g>

    <!-- Terminal 3 -->
    <g transform="translate(18, 276)">
      <rect width="224" height="88" rx="8" fill="url(#glowBox)" stroke="#334155" />
      <text x="14" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Service Desk &amp; Admin</text>
      <text x="14" y="44" fill="#94a3b8" font-family="monospace" font-size="10">X-Terminal-Id: SERVICE-DESK</text>
      <text x="14" y="62" fill="#e2e8f0" font-family="sans-serif" font-size="10">📄 A4 GST Tax Invoice Print</text>
      <text x="14" y="78" fill="#f59e0b" font-family="sans-serif" font-size="10">📊 ERP Ledgers &amp; Stock Adj.</text>
    </g>
  </g>

  <!-- Middle: Connectors -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.8">
    <path d="M 320 215 L 440 215" stroke-dasharray="6,4" />
    <polygon points="440,210 450,215 440,220" fill="#38bdf8" />

    <path d="M 320 315 L 440 315" stroke-dasharray="6,4" />
    <polygon points="440,310 450,315 440,320" fill="#38bdf8" />

    <path d="M 320 415 L 440 415" stroke-dasharray="6,4" />
    <polygon points="440,410 450,415 440,420" fill="#38bdf8" />
  </g>
  <text x="380" y="195" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">HTTP/JSON</text>
  <text x="380" y="210" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Idempotent</text>

  <!-- Right: On-Premise Core Server -->
  <g transform="translate(450, 105)">
    <rect width="490" height="390" rx="12" fill="#0b1324" stroke="#2563eb" stroke-width="2" />
    <text x="245" y="32" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      ON-PREMISE DJANGO BACKEND SERVER (:8000)
    </text>
    <text x="245" y="48" fill="#10b981" font-family="monospace" font-size="10" text-anchor="middle">
      Zero Client Authority • Atomic Transactions • Sub-200ms
    </text>

    <!-- Middleware / Gateway -->
    <g transform="translate(20, 65)">
      <rect width="450" height="42" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="225" y="26" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">
        🛡️ JWT Auth &amp; RBAC + Idempotency Tracking Middleware
      </text>
    </g>

    <!-- Engines Grid -->
    <g transform="translate(20, 118)">
      <!-- GST Engine -->
      <g>
        <rect width="215" height="74" rx="8" fill="url(#glowBox)" stroke="#334155" />
        <text x="14" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Indian GST Engine</text>
        <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">CGST, SGST, IGST calculation</text>
        <text x="14" y="58" fill="#10b981" font-family="sans-serif" font-size="10">Reverse-tax gross extraction</text>
      </g>

      <!-- Ledger Engine -->
      <g transform="translate(235, 0)">
        <rect width="215" height="74" rx="8" fill="url(#glowBox)" stroke="#334155" />
        <text x="14" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Double-Entry Ledger</text>
        <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">Party running debit/credit</text>
        <text x="14" y="58" fill="#10b981" font-family="sans-serif" font-size="10">Cash drawer &amp; bank accounts</text>
      </g>

      <!-- POS Quick-Bill -->
      <g transform="translate(0, 84)">
        <rect width="215" height="74" rx="8" fill="url(#glowBox)" stroke="#334155" />
        <text x="14" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Quick-Bill POS Engine</text>
        <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">Atomic row locks on stock</text>
        <text x="14" y="58" fill="#10b981" font-family="sans-serif" font-size="10">&lt;200ms commit lifecycle</text>
      </g>

      <!-- Print Engine -->
      <g transform="translate(235, 84)">
        <rect width="215" height="74" rx="8" fill="url(#glowBox)" stroke="#334155" />
        <text x="14" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Tax Invoice &amp; Thermal</text>
        <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">A4 GST Compliant Invoices</text>
        <text x="14" y="58" fill="#10b981" font-family="sans-serif" font-size="10">Raw ESC/POS Thermal byte streams</text>
      </g>
    </g>

    <!-- Database Layer -->
    <g transform="translate(20, 290)">
      <rect width="450" height="75" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="225" y="28" fill="#10b981" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">
        🗄️ SQLite 3 (WAL Mode + 20s Busy Timeout)
      </text>
      <text x="225" y="50" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">
        Zero Client Authority • High Concurrency Concurrent Reads &amp; Serialized Writes
      </text>
    </g>
  </g>
</svg>
